<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"><title>学习记录迁移</title><style>
  :root{
    --paper:#f5f4f0; --card:#fbfaf7; --card-2:#f0eee7;
    --ink:#1e2630; --ink-soft:#586374; --ink-faint:#8b93a0;
    --line:#e5e1d8; --line-strong:#d4cfc4;
    --shu:#c0442c;
    --katsu:#1f7a63;  --katsu-t:rgba(31,122,99,.11);
    --keigo:#8a4fa8;  --keigo-t:rgba(138,79,168,.12);
    --joshi:#c0442c;  --joshi-t:rgba(192,68,44,.10);
    --goi:#2f5fa6;    --goi-t:rgba(47,95,166,.10);
    --font-mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Songti SC",serif;
    --font-gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    --font-cn:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --font-latin:ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#12151a; --card:#191d24; --card-2:#20252d;
      --ink:#e9e7e1; --ink-soft:#a4adb9; --ink-faint:#727b88;
      --line:#282d36; --line-strong:#39404b;
      --shu:#e0755c;
      --katsu:#4bc0a1; --katsu-t:rgba(75,192,161,.14);
      --keigo:#c091df; --keigo-t:rgba(192,145,223,.15);
      --joshi:#e8836c; --joshi-t:rgba(232,131,108,.14);
      --goi:#7aa8e2;   --goi-t:rgba(122,168,226,.15);
    }
  }
  :root[data-theme="light"]{
    --paper:#f5f4f0; --card:#fbfaf7; --card-2:#f0eee7;
    --ink:#1e2630; --ink-soft:#586374; --ink-faint:#8b93a0;
    --line:#e5e1d8; --line-strong:#d4cfc4; --shu:#c0442c;
    --katsu:#1f7a63; --katsu-t:rgba(31,122,99,.11);
    --keigo:#8a4fa8; --keigo-t:rgba(138,79,168,.12);
    --joshi:#c0442c; --joshi-t:rgba(192,68,44,.10);
    --goi:#2f5fa6;   --goi-t:rgba(47,95,166,.10);
  }
  :root[data-theme="dark"]{
    --paper:#12151a; --card:#191d24; --card-2:#20252d;
    --ink:#e9e7e1; --ink-soft:#a4adb9; --ink-faint:#727b88;
    --line:#282d36; --line-strong:#39404b; --shu:#e0755c;
    --katsu:#4bc0a1; --katsu-t:rgba(75,192,161,.14);
    --keigo:#c091df; --keigo-t:rgba(192,145,223,.15);
    --joshi:#e8836c; --joshi-t:rgba(232,131,108,.14);
    --goi:#7aa8e2;   --goi-t:rgba(122,168,226,.15);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--font-cn);line-height:1.75;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .wrap{max-width:46rem;margin:0 auto;padding:clamp(1.5rem,4vw,3.5rem) clamp(1.1rem,4vw,2rem) 5rem;}

  /* ---------- header ---------- */
  .eyebrow{font-family:var(--font-latin);font-size:.72rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--shu);font-weight:600;margin:0 0 .9rem;}
  h1{font-family:var(--font-mincho);font-weight:600;
    font-size:clamp(1.7rem,5.4vw,2.55rem);line-height:1.35;margin:0;
    text-wrap:balance;letter-spacing:.01em;}
  .sub{color:var(--ink-soft);font-size:1rem;margin:.9rem 0 0;max-width:38rem;}
  .meta{display:flex;flex-wrap:wrap;gap:.5rem .55rem;margin:1.4rem 0 0;}
  .tag{font-family:var(--font-gothic);font-size:.78rem;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--line);border-radius:2rem;
    padding:.28rem .7rem;white-space:nowrap;}
  .tag b{color:var(--ink);font-weight:600;}

  .note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--shu);
    border-radius:.5rem;padding:.95rem 1.15rem;margin:1.6rem 0 0;
    font-size:.9rem;color:var(--ink-soft);line-height:1.7;}
  .note b{color:var(--ink);}

  /* sticky video dock — click any timestamp to seek */
  .video-dock{position:sticky;top:0;z-index:30;margin:1.6rem 0 0;background:var(--paper);
    border:1px solid var(--line);border-radius:.7rem;overflow:hidden;
    box-shadow:0 10px 24px -16px rgba(0,0,0,.55);}
  .dock-bar{display:flex;align-items:center;gap:.6rem;
    padding:.5rem .5rem .5rem .85rem;background:var(--card);border-bottom:1px solid var(--line);}
  .dock-title{font-family:var(--font-gothic);font-weight:600;font-size:.82rem;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tri{color:var(--shu);}
  .dock-min{margin-left:auto;font-family:var(--font-gothic);font-size:.75rem;font-weight:600;
    cursor:pointer;color:var(--ink-soft);background:transparent;border:1px solid var(--line-strong);
    border-radius:2rem;padding:.24rem .75rem;white-space:nowrap;transition:color .15s,border-color .15s;}
  .dock-min:hover{color:var(--shu);border-color:var(--shu);}
  .dock-min:focus-visible{outline:2px solid var(--shu);outline-offset:2px;}
  /* play/pause — the primary transport control, built by player_auto.js into the dock bar.
     The bar is sticky and survives minimising, so this is reachable whenever the page is. */
  .dock-play{font-family:var(--font-gothic);font-size:.8rem;font-weight:600;cursor:pointer;
    color:var(--ink);background:transparent;border:1px solid var(--line-strong);border-radius:999px;
    padding:.22rem .6rem;margin-right:.4rem;line-height:1.2;min-width:2.2rem;}
  .dock-play:hover{color:var(--shu);border-color:var(--shu);}
  .dock-play:focus-visible{outline:2px solid var(--shu);outline-offset:2px;}
  .dock-play[aria-pressed="true"]{color:var(--shu);border-color:var(--shu);}
  .dock-min{margin-left:0;}
  .dock-follow{margin-left:auto;font-family:var(--font-gothic);font-size:.75rem;font-weight:600;
    cursor:pointer;color:var(--ink-soft);background:transparent;border:1px solid var(--line-strong);
    border-radius:2rem;padding:.24rem .7rem;white-space:nowrap;
    transition:color .15s,border-color .15s,background .15s;}
  .dock-follow:hover{color:var(--shu);border-color:var(--shu);}
  .dock-follow.on{color:var(--shu);border-color:var(--shu);background:var(--joshi-t);}
  .dock-follow.sticky{border-style:double;box-shadow:inset 0 0 0 1px var(--shu);}
  .dock-follow:focus-visible{outline:2px solid var(--shu);outline-offset:2px;}
  /* The sticky video must never crowd out the sentence it exists to explain. The frame is an
     aspect-ratio box, so its HEIGHT follows its WIDTH — bounding the height therefore means bounding
     the width by the height budget (h*16/9), not slapping a max-height on a 16:9 box and letterboxing
     it. --dock-max is that budget. This cap used to live inside @media (max-width:560px), i.e. it was
     keyed on the screen being NARROW when the problem is the screen being SHORT: a landscape phone is
     844px wide and 390px tall, sailed straight past it, and gave the video 335px — 86% of the
     viewport, leaving a 31px sliver of the sentence you are supposed to be reading. */
  .dock-video{max-width:min(32rem, calc(var(--dock-max) * 16 / 9));margin:0 auto;}
  .video-frame{position:relative;aspect-ratio:16/9;background:#000;max-height:var(--dock-max);}
  .video-frame iframe,.video-frame video{position:absolute;inset:0;width:100%;height:100%;
    border:0;display:block;background:#000;object-fit:contain;}
  /* 遮中文 (band magnifier): one fixed overlay inside the video frame. On a native <video> it is a
     canvas drawing the Japanese band into the Chinese band's rectangle — cover and magnify in one
     element, so the mask cannot drift from what it magnifies. On a cross-origin player the pixels
     cannot be read, so the same rectangle becomes an opaque cover: still the only mask, just
     without magnification. Geometry: data-band-zh / data-band-ja on .video-frame. */
  .cn-mask{position:absolute;z-index:3;pointer-events:none;background:#000;display:block;
    transition:opacity .15s ease;}
  /* peeking: the pointer is over the native controls strip, which the overlay covers (page_tools.js) */
  .cn-mask.cn-peek{opacity:0;}
  .cn-mask[hidden]{display:none;}
  .video-dock.min .dock-video{display:none;}
  .play-hint{font-size:.83rem;color:var(--ink-soft);margin:.75rem 0 0;}
  .play-hint b{color:var(--ink);font-weight:600;}

  /* furigana control bar */
  .hide-translations .u-cn{display:none}
  .study-state-bar{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
  .study-state-bar button{min-height:44px;padding:.5rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:inherit;cursor:pointer}
  .study-state-bar button[aria-pressed="true"]{border-color:currentColor}
  .idx-completion{display:inline-block;margin:.3rem .5rem;color:var(--ink-soft);font-size:.8rem}
  .furi-bar{display:flex;align-items:center;justify-content:space-between;gap:.7rem 1rem;
    flex-wrap:wrap;margin:1.5rem 0 0;padding:.7rem .5rem .7rem 1rem;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--goi);border-radius:.55rem;font-size:.85rem;}
  .furi-hint{color:var(--ink-soft);}
  .furi-hint b{color:var(--ink);font-weight:600;}
  #furiToggle{font-family:var(--font-gothic);font-size:.8rem;font-weight:600;cursor:pointer;
    color:var(--goi);background:transparent;border:1px solid var(--goi);border-radius:2rem;
    padding:.32rem .9rem;white-space:nowrap;transition:background .15s,color .15s;}
  #furiToggle[aria-pressed="true"]{background:var(--goi);color:var(--paper);}
  #furiToggle:focus-visible{outline:2px solid var(--goi);outline-offset:2px;}

  .rule{height:1px;background:var(--line-strong);border:0;margin:2.4rem 0;}

  /* ---------- legend ---------- */
  .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.2rem,1fr));
    gap:.55rem;margin:1.5rem 0 0;}
  .lg{display:flex;align-items:baseline;gap:.5rem;font-size:.83rem;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:.5rem;padding:.55rem .7rem;background:var(--card);}
  .swatch{width:.72rem;height:.72rem;border-radius:.2rem;flex:none;transform:translateY(.05rem);}
  .lg b{color:var(--ink);font-weight:600;font-family:var(--font-gothic);}
  /* The hint under each category may be ONE unbreakable Latin token — the en profile's
     「relative/conditional/cleft…」 is 166px with no break opportunity (browsers do not wrap at '/'),
     and as a flex/grid item's min-content it pushed gaffigan-teenagers 7px past a 390px phone.
     `anywhere` (not break-word) is the value that also lowers min-content, so the cell can shrink
     and the token wraps only when it has to. */
  .lg > span:last-child{min-width:0;overflow-wrap:anywhere;}

  /* ---------- section label ---------- */
  .sec{font-family:var(--font-latin);font-size:.74rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-faint);font-weight:600;
    margin:3.2rem 0 1.2rem;display:flex;align-items:center;gap:.8rem;}
  .sec::after{content:"";flex:1;height:1px;background:var(--line);}

  /* ---------- grammar card ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:.85rem;
    padding:1.35rem 1.4rem 1.5rem;margin:0 0 1.15rem;}
  .card-top{display:flex;align-items:center;gap:.7rem;margin:0 0 .95rem;flex-wrap:wrap;}
  .num{font-family:var(--font-mincho);font-size:1.05rem;color:var(--shu);font-weight:600;
    font-variant-numeric:tabular-nums;}
  .ts{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-soft);
    background:var(--card-2);border:1px solid transparent;border-radius:.3rem;
    padding:.15rem .5rem .15rem .42rem;font-variant-numeric:tabular-nums;cursor:pointer;
    transition:color .12s,border-color .12s,background .12s;}
  .ts::before{content:"\25B8";color:var(--shu);margin-right:.3rem;font-size:.92em;}
  .ts:hover,.ts:focus-visible{color:var(--shu);border-color:var(--shu);outline:none;}
  .ts.flash{animation:ts-flash .9s ease;}
  @keyframes ts-flash{0%,22%{background:var(--shu);color:#fff;border-color:var(--shu);}
    100%{background:var(--card-2);color:var(--ink-soft);border-color:transparent;}}
  @media (prefers-reduced-motion:reduce){.ts.flash{animation:none;}}
  .theme{font-family:var(--font-gothic);font-size:.8rem;color:var(--ink-soft);margin-left:auto;}

  .jp{font-family:var(--font-mincho);font-size:clamp(1.24rem,3.7vw,1.5rem);
    line-height:2.35;margin:.2rem 0 .1rem;color:var(--ink);letter-spacing:.02em;}
  ruby{cursor:pointer;}
  ruby rt{font-family:var(--font-gothic);font-size:.46em;color:var(--ink-faint);
    font-weight:400;letter-spacing:0;
    visibility:hidden;opacity:0;transition:opacity .12s ease;}
  /* reveal: hover = peek · tap/click(.reveal) = pin · keyboard focus = peek · master toggle = all */
  ruby:hover rt,ruby:focus-visible rt,ruby.reveal rt,
  body.show-furi ruby rt{visibility:visible;opacity:1;}
  ruby:focus-visible{outline:2px solid var(--shu);outline-offset:1px;border-radius:.15em;}
  @media (prefers-reduced-motion:reduce){ruby rt{transition:none;}}
  .fx{padding:.02em .08em;border-radius:.15em;font-weight:600;
    border-bottom:2px solid currentColor;}
  .fx.katsu{color:var(--katsu);background:var(--katsu-t);}
  .fx.keigo{color:var(--keigo);background:var(--keigo-t);}
  .fx.joshi{color:var(--joshi);background:var(--joshi-t);}
  .fx.goi{color:var(--goi);background:var(--goi-t);}
  .fx ruby rt{color:inherit;}

  .cn{font-size:.96rem;color:var(--ink-soft);margin:.55rem 0 0;padding:.55rem 0 0;
    border-top:1px dashed var(--line);}
  .cn b{color:var(--ink);font-weight:600;}
  .cn .lbl{font-family:var(--font-latin);font-size:.68rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-faint);margin-right:.5rem;}

  .points{list-style:none;margin:1.1rem 0 0;padding:0;display:flex;flex-direction:column;gap:.75rem;}
  .points li{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start;
    font-size:.92rem;line-height:1.68;}
  .chip{font-family:var(--font-gothic);font-size:.72rem;font-weight:600;white-space:nowrap;
    padding:.2rem .5rem;border-radius:.35rem;border:1px solid;line-height:1.3;margin-top:.16rem;}
  .chip.katsu{color:var(--katsu);background:var(--katsu-t);border-color:var(--katsu);}
  .chip.keigo{color:var(--keigo);background:var(--keigo-t);border-color:var(--keigo);}
  .chip.joshi{color:var(--joshi);background:var(--joshi-t);border-color:var(--joshi);}
  .chip.goi{color:var(--goi);background:var(--goi-t);border-color:var(--goi);}
  .u-points .chip{cursor:pointer;}                       /* tap to save the term to the 词汇 deck (online) */
  .chip.saved{box-shadow:inset 0 0 0 2px currentColor;}
  .chip.saved::after{content:'✓';margin-left:.25em;font-weight:700;}
  .points b{color:var(--ink);font-weight:600;}
  .points .jt{font-family:var(--font-gothic);}
  .points em{font-style:normal;color:var(--ink-faint);}

  /* ---------- reference tables ---------- */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:.7rem;background:var(--card);}
  table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:26rem;}
  caption{text-align:left;font-family:var(--font-gothic);font-weight:600;color:var(--ink);
    padding:.9rem 1rem .2rem;font-size:.98rem;}
  th,td{text-align:left;padding:.6rem .85rem;border-bottom:1px solid var(--line);vertical-align:top;}
  thead th{font-family:var(--font-gothic);font-size:.76rem;letter-spacing:.04em;
    color:var(--ink-faint);font-weight:600;background:var(--card-2);}
  tbody tr:last-child td{border-bottom:0;}
  td .jt{font-family:var(--font-gothic);color:var(--ink);font-weight:600;}
  td .rd{color:var(--ink-faint);font-size:.82rem;}
  .tbl-wrap+.tbl-wrap{margin-top:1.1rem;}

  footer{margin-top:3.5rem;padding-top:1.5rem;border-top:1px solid var(--line);
    font-size:.8rem;color:var(--ink-faint);line-height:1.7;}
  a{color:var(--shu);}

  @media (max-width:480px){
    .points li{grid-template-columns:1fr;gap:.3rem;}
    .chip{justify-self:start;}
    .theme{margin-left:0;width:100%;}
  }

  /* ===== per-sentence analysis ===== */
  .lead{font-size:.9rem;color:var(--ink-soft);margin:0 0 1.4rem;line-height:1.7;}
  .lead .tri{color:var(--shu);}
  .lead .ts-demo{font-family:var(--font-mono);font-size:.8rem;color:var(--shu);
    border:1px solid var(--shu);border-radius:.3rem;padding:.02rem .35rem;}
  .chapter{margin:2.4rem 0 0;}
  .chapter-h{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin:0 0 .35rem;}
  .chapter-n{font-family:var(--font-mincho);color:var(--shu);font-weight:600;font-size:1.15rem;
    font-variant-numeric:tabular-nums;}
  .chapter-t{font-family:var(--font-gothic);font-weight:600;font-size:1.02rem;color:var(--ink);}
  .chapter-c{color:var(--ink-faint);font-weight:400;font-size:.85rem;margin-left:.5rem;}
  .chapter-r{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;}
  .chapter-h::after{content:"";flex:1;height:1px;background:var(--line);min-width:1.5rem;
    align-self:center;}

  .u{display:grid;grid-template-columns:4.6rem 1fr;gap:.2rem .85rem;
    padding:.9rem 0;border-top:1px solid var(--line);scroll-margin-top:5rem;
    transition:background .25s ease;}
  .u.key{box-shadow:inset 3px 0 0 var(--shu);padding-left:.75rem;
    border-radius:0 .4rem .4rem 0;background:linear-gradient(90deg,var(--joshi-t),transparent 55%);}
  .u.active{background:var(--joshi-t);box-shadow:inset 3px 0 0 var(--shu);
    border-radius:0 .4rem .4rem 0;padding-left:.75rem;}
  .u.active .ts{background:var(--shu);color:#fff;border-color:var(--shu);}
  .u.active .ts::before{color:#fff;}
  .u.active .u-jp{color:var(--ink);}
  .u-meta{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;padding-top:.15rem;}
  .u-meta .ts{width:100%;text-align:center;}
  /* The chip must WRAP, never nowrap. `.u` is a fixed 4.6rem gutter + 1fr body, and a grid item
     that cannot shrink does not clip — it paints over the column next to it, which here is the 译
     line. `white-space:nowrap` therefore put every label wider than ~5 full-width characters on top
     of the translation: 12 of 21 shipped pages, worst 89px past the gutter (「サクちゃん（お便り読み
     上げ）」 on tonari-otayori-182) and 90 of 221 rows overlapping on mushoku-tensei-s3-01. Sections
     A/A1 of ux.sh could not see it — they measure against the DEVICE width, and this overflow never
     leaves the page. Guarded behaviourally by ux.sh section A3.
     `anywhere` (not `break-word`) is what makes the MIN-CONTENT width shrink, so the chip can be
     narrower than its longest unbreakable run; `break-word` leaves min-content at the full run and
     the box would still spill. Same trade the ≤520px `.chip{white-space:normal}` rule already makes:
     wrapping a long label costs a line, not wrapping it costs the column. */
  .spk{font-family:var(--font-gothic);font-size:.66rem;font-weight:600;line-height:1.3;
    padding:.12rem .4rem;border-radius:.3rem;border:1px solid transparent;
    max-width:100%;white-space:normal;overflow-wrap:anywhere;}
  .spk.iwata{color:var(--goi);background:var(--goi-t);}
  .spk.host{color:var(--ink-soft);background:var(--card-2);}
  .spk.nare{color:var(--katsu);background:var(--katsu-t);}
  .spk.neta{color:var(--shu);background:var(--joshi-t);}
  .key-star{color:var(--shu);font-size:.8rem;line-height:1;}

  .u-body{min-width:0;}
  .u-jp{font-family:var(--font-mincho);font-size:1.14rem;line-height:2.15;color:var(--ink);
    letter-spacing:.01em;}
  .u-cn{font-size:.9rem;color:var(--ink-soft);margin-top:.15rem;}
  .u-cn .lbl{font-family:var(--font-latin);font-size:.64rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-faint);margin-right:.45rem;
    border:1px solid var(--line-strong);border-radius:.25rem;padding:.02rem .28rem;}
  .u-asr{font-size:.78rem;color:var(--ink-faint);margin-top:.4rem;line-height:1.55;}
  .tag-asr{font-family:var(--font-gothic);font-size:.64rem;font-weight:600;color:var(--shu);
    background:var(--joshi-t);border-radius:.25rem;padding:.05rem .35rem;margin-right:.4rem;
    white-space:nowrap;}
  .u-telop{font-size:.78rem;color:var(--ink-faint);margin-top:.35rem;line-height:1.55;}
  /* テロップ track hide/show (page_tools.js builds the button). Hides, never swaps —
     the chip shows spoken AND telop, and their difference is the teaching point. */
  body.no-telop .u-telop{display:none;}
  .tag-telop{font-family:var(--font-gothic);font-size:.64rem;font-weight:600;color:var(--ink);
    background:var(--goi-t);border-radius:.25rem;padding:.05rem .35rem;margin-right:.4rem;
    white-space:nowrap;}
  .u-points{list-style:none;margin:.55rem 0 0;padding:0;display:flex;flex-direction:column;gap:.4rem;}
  .u-points li{display:grid;grid-template-columns:auto 1fr;gap:.55rem;align-items:start;
    font-size:.85rem;line-height:1.6;}
  .u-points .chip{margin-top:.08rem;font-size:.68rem;}
  .u-points .star{color:var(--shu);}

  @media (max-width:520px){
    .u{grid-template-columns:1fr;gap:.45rem;}
    /* flex-wrap is NOT optional here. This rule lays the metadata out as a ROW on the narrowest
       screens, and the row's content is un-shrinkable: the ts, the 44px touch tap targets (fav +
       3 .u-act, forced by the (hover:none)+(pointer:coarse) block below), and — when this was
       written — a .spk whose width was set by the speaker's NAME: 36px for 「先輩」, 129px for
       「スタッフ(フクロウ担当)」. That last one no longer holds; .spk now wraps and shrinks (see its
       rule above, which had to change for the same reason at DESKTOP width, where the label was
       overrunning the gutter into the 译 column). The ts and the tap targets are still rigid, so
       this rule stays load-bearing on its own. Left unwrapped the row cannot fit a phone, and the
       overflow does not clip: the browser widens
       the LAYOUT VIEWPORT to swallow it (320 -> 387 on konkatsu, 459 on iginari-fureai), so the whole
       page slides sideways under the thumb. Wrapping .u-actions alone is NOT enough — it still left
       the widest page 43px over. Guarded by ux.sh section A, which measures against the DEVICE width. */
    .u-meta{flex-direction:row;align-items:center;gap:.5rem;flex-wrap:wrap;}
    .u-meta .ts{width:auto;}
    .u.key{background:none;}
    .u-points li{grid-template-columns:1fr;gap:.2rem;}
    /* .chip is white-space:nowrap so a grammar term never breaks mid-word — right on a desktop,
       ruinous on a phone. A chip's min-content is then its ENTIRE label, and these labels are as
       long as the grammar needs: 「～ていなきゃいけない」（～ていなければいけない の口語省略）★ measures
       357px against a ~273px column. `1fr` is minmax(AUTO,1fr), and that auto floor is min-content,
       so the column cannot shrink under the chip — it drags the row, and the page, off-screen
       (oshare-takedatsu: 386px on a 320px phone). Wrapping a long chip costs one line; not wrapping
       it costs the whole page. Short chips are unaffected — they only wrap when they cannot fit. */
    .chip{white-space:normal;}
  }

  /* ============================================================
     MOBILE / TOUCH ADAPTATION  (additive; later rules override)
     ============================================================ */
  :root{ --dock-max:42vh; }
  @supports (height:100dvh){ :root{ --dock-max:42dvh; } }

  /* narrow screens: keep the sticky video from eating the viewport, honour the notch */
  @media (max-width:560px){
    body{ overflow-x:hidden; }                 /* safety net against any stray overflow */
    .wrap{ padding-left:max(1.1rem,env(safe-area-inset-left));
           padding-right:max(1.1rem,env(safe-area-inset-right)); }
    .video-dock{ top:env(safe-area-inset-top,0px); margin-top:1rem; }
    .dock-video{ max-width:none; }
    .video-frame{ max-height:var(--dock-max); }
    /* dock bar: let the long title ellipsize so 跟随 / 收起 never get pushed off-screen */
    .dock-bar{ gap:.4rem; padding-left:.75rem; }
    .dock-title{ flex:1 1 auto; min-width:0; }
    .dock-min,.dock-follow{ flex:none; }
    .tag{ white-space:normal; }                /* long 名台词 pills wrap instead of overflowing */
    .sec{ margin-top:2.4rem; }
  }
  /* Landscape phone: the video earns a slightly bigger share than portrait — but 82vh (what this used
     to grant) left 55px for the transcript. 45dvh is the largest video that still leaves a WHOLE
     sentence card readable beneath it; at 50dvh the grammar points get clipped, and the points are the
     content. Measured, not guessed: at 45dvh the room below the dock is 168px for a 164px card. */
  @media (orientation:landscape) and (max-height:480px){
    :root{ --dock-max:45vh; }
  }
  @supports (height:100dvh){
    @media (orientation:landscape) and (max-height:480px){ :root{ --dock-max:45dvh; } }
  }

  /* touch devices (no hover): >=44px hit targets. hover-peek can't fire on touch,
     so the master toggle + tap-to-pin (.reveal) are the furigana controls. */
  @media (hover:none) and (pointer:coarse){
    .ts{ min-height:44px; padding:.5rem .7rem; display:inline-flex;
         align-items:center; justify-content:center; }
    .dock-min,.dock-follow,.dock-shadow-toggle,.dock-hl-toggle,.dock-dict-toggle,.dock-pin-toggle,.dock-toc-toggle{ min-height:44px; min-width:44px; padding:.5rem .95rem; }
    .dock-play{ min-height:44px; min-width:44px; padding:.5rem .7rem; }
    /* The play button costs width, and it squeezed the dock title to 「なぜ…」 — a truncation
       that carries no information. On a touch screen the title is already redundant: the
       page H1 sits directly above the dock. So the TITLE yields the space, not the controls.
       The ▶ marker stays, so the bar still reads as the player. */
    /* Hide the title OUTRIGHT, marker included. Keeping the ▶ marker while dropping the text
       left two triangles side by side — a red decorative one and the real play button —
       which reads as two controls, one of which does nothing. */
    .dock-title{ display:none; }
    #furiToggle{ min-height:44px; padding:.55rem 1.1rem; }
    ruby{ padding:.12em .06em; border-radius:.2em; }
    .u-points .chip{ padding:.3rem .6rem; }
  }

  /* re-follow button: the player shows it (bottom, thumb-reach) when auto-follow
     is off during playback, so re-arming is one tap even far down the page */
  #refollow{ position:fixed; z-index:40;
    right:max(1rem,env(safe-area-inset-right));
    bottom:max(1rem,env(safe-area-inset-bottom));
    display:none; align-items:center; gap:.4rem; min-height:44px;
    font-family:var(--font-gothic); font-size:.85rem; font-weight:600;
    color:#fff; background:var(--shu); border:0; border-radius:2rem;
    padding:.6rem 1.15rem; box-shadow:0 8px 22px -8px rgba(0,0,0,.55);
    cursor:pointer; opacity:0; transform:translateY(10px);
    transition:opacity .2s ease,transform .2s ease; }
  #refollow.show{ display:inline-flex; opacity:1; transform:none; }
  #refollow:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  @media (prefers-reduced-motion:reduce){ #refollow{ transition:none; } }

  /* horizontally-scrollable reference tables: fade + shadow hint you can swipe */
  .tbl-wrap{ position:relative;
    background:
      linear-gradient(90deg,var(--card),transparent) 0 0,
      linear-gradient(90deg,transparent,var(--card)) 100% 0,
      radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.16),transparent) 0 0,
      radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.16),transparent) 100% 0;
    background-repeat:no-repeat;
    background-size:2.4rem 100%,2.4rem 100%,1.1rem 100%,1.1rem 100%;
    background-attachment:local,local,scroll,scroll; }

  /* ============================================================
     LANG-NAV — slim cross-page nav (目录 home / prev·next / 收藏 + sync dot).
     Non-sticky: scrolls away so it never fights the sticky .video-dock.
     Markup: scripts/nav.py · live badge: assets/nav.js.
     ============================================================ */
  .lang-nav{display:flex;align-items:center;gap:.5rem .7rem;flex-wrap:nowrap;
    margin:0 0 1.6rem;padding:.5rem .1rem;font-family:var(--font-gothic);
    font-size:.82rem;border-bottom:1px solid var(--line);}
  .lang-nav a{text-decoration:none;color:var(--ink-soft);}
  .ln-brand{font-weight:700;color:var(--keigo);white-space:nowrap;
    display:inline-flex;gap:.3rem;align-items:center;}
  .ln-brand.ln-current{cursor:default;}
  .ln-mark{font-size:1.05em;}
  .ln-ctx{color:var(--ink-faint);font-size:.75rem;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .ln-pn{display:inline-flex;gap:.35rem;margin-left:auto;}
  .ln-pn a{border:1px solid var(--line);border-radius:.4rem;padding:.15rem .55rem;white-space:nowrap;}
  .ln-pn a:hover{color:var(--shu);border-color:var(--shu);}
  .ln-fav{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);
    border-radius:.5rem;padding:.2rem .6rem;font-weight:600;white-space:nowrap;margin-left:auto;}
  .ln-pn ~ .ln-fav{margin-left:.4rem;}
  .ln-fav.ln-current{color:var(--goi);border-color:var(--goi);cursor:default;}
  .ln-star{color:var(--shu);}
  .ln-fav-n{font-variant-numeric:tabular-nums;}
  .ln-dot{width:.5rem;height:.5rem;border-radius:50%;box-shadow:0 0 0 3px rgba(127,127,127,.10);flex:none;}
  .ln-ok{background:#3aa76d;} .ln-wait{background:#d9a520;}
  .ln-off{background:#9aa0a6;} .ln-err{background:#d1453b;}
  @media (max-width:560px){
    .ln-ctx{display:none;}
    .ln-prev,.ln-next{font-size:0;}
    .ln-prev::before{content:"‹";font-size:.9rem;}
    .ln-next::before{content:"›";font-size:.9rem;}
  }

  /* ============================================================
     FAVORITES (收藏) — capture per sentence, filter, deep-link.
     The user bookmark is deliberately DISTINCT from the author ★
     (.key-star, --shu): a bookmark glyph in --goi. See plans/favorites.md.
     ============================================================ */
  .fav-btn{ appearance:none;-webkit-appearance:none;background:transparent;border:0;
    color:var(--goi);cursor:pointer;padding:.25rem;margin-top:.1rem;line-height:0;
    border-radius:.35rem;opacity:.5;transition:opacity .15s,color .15s,transform .1s;}
  .fav-btn svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;display:block;}
  .fav-btn:hover{opacity:1;}
  .fav-btn:active{transform:scale(.9);}
  .fav-btn[aria-pressed="true"]{opacity:1;}
  .fav-btn[aria-pressed="true"] svg{fill:currentColor;}
  .fav-btn:focus-visible{outline:2px solid var(--goi);outline-offset:2px;opacity:1;}

  #favFilter{font-family:var(--font-gothic);font-size:.8rem;font-weight:600;cursor:pointer;
    color:var(--goi);background:transparent;border:1px solid var(--goi);border-radius:2rem;
    padding:.32rem .9rem;white-space:nowrap;transition:background .15s,color .15s;}
  #favFilter[aria-pressed="true"]{background:var(--goi);color:var(--paper);}
  #favFilter:focus-visible{outline:2px solid var(--goi);outline-offset:2px;}
  #favEmpty{margin:1.2rem 0 0;padding:.9rem 1.15rem;font-size:.88rem;color:var(--ink-soft);
    background:var(--card);border:1px dashed var(--line-strong);border-radius:.5rem;}

  /* filter view: hide everything not favorited */
  body.fav-only .u:not(.faved){display:none;}

  /* deep-link arrival flash (from favorites.html #fav=…) */
  .u.fav-jump{animation:fav-jump 1.5s ease;}
  @keyframes fav-jump{0%,28%{background:var(--goi-t);box-shadow:inset 3px 0 0 var(--goi);
    border-radius:0 .4rem .4rem 0;}100%{background:transparent;}}
  @media (prefers-reduced-motion:reduce){.u.fav-jump{animation:none;}}

  /* touch: the bookmark is a >=44px target, well clear of the seeking .ts */
  @media (hover:none) and (pointer:coarse){
    .fav-btn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:.4rem;}
    #favFilter{min-height:44px;padding:.55rem 1.1rem;}
  }

  /* ============================================================
     IN-PAGE STUDY UX — shadow drill (跟读) · filter/search · per-row share.
     shadow.js + page_tools.js (pure cores unit-tested). plans/in-page-study-ux.md
     ============================================================ */
  /* shadow toggle in the dock bar (sits next to 跟随) */
  .dock-shadow-toggle, .dock-hl-toggle, .dock-dict-toggle, .dock-cn-toggle, .dock-layout-toggle, .dock-pin-toggle{font-family:var(--font-gothic);font-size:.75rem;font-weight:600;cursor:pointer;
    color:var(--ink-soft);background:transparent;border:1px solid var(--line-strong);border-radius:2rem;
    padding:.24rem .7rem;white-space:nowrap;flex:none;transition:color .15s,border-color .15s,background .15s;}
  .dock-shadow-toggle:hover, .dock-hl-toggle:hover, .dock-dict-toggle:hover, .dock-cn-toggle:hover, .dock-layout-toggle:hover, .dock-pin-toggle:hover{color:var(--keigo);border-color:var(--keigo);}
  .dock-shadow-toggle.on, .dock-hl-toggle.on, .dock-dict-toggle.on, .dock-cn-toggle.on, .dock-layout-toggle.on, .dock-pin-toggle.on{color:var(--keigo);border-color:var(--keigo);background:var(--keigo-t);}
  .dock-shadow-toggle:focus-visible, .dock-hl-toggle:focus-visible, .dock-dict-toggle:focus-visible, .dock-cn-toggle:focus-visible, .dock-layout-toggle:focus-visible, .dock-pin-toggle:focus-visible{outline:2px solid var(--keigo);outline-offset:2px;}
  .dock-shadow-toggle[disabled]{opacity:.45;cursor:progress;}
  /* 目录 jump menu (回到开头 + chapters) — button matches the dock toggles; page_tools.js builds it. */
  .dock-bar{position:relative;}
  .dock-toc-toggle{font-family:var(--font-gothic);font-size:.75rem;font-weight:600;cursor:pointer;
    color:var(--ink-soft);background:transparent;border:1px solid var(--line-strong);border-radius:2rem;
    padding:.24rem .7rem;white-space:nowrap;flex:none;transition:color .15s,border-color .15s,background .15s;}
  .dock-toc-toggle:hover{color:var(--shu);border-color:var(--shu);}
  .dock-toc-toggle.on{color:var(--shu);border-color:var(--shu);background:var(--card-2);}
  .dock-toc-toggle:focus-visible{outline:2px solid var(--shu);outline-offset:2px;}
  /* position:FIXED + appended to <body> (not the bar): the dock clips its overflow — .video-dock is
     overflow:hidden and on phones .dock-bar is overflow-x:auto — so an absolutely-positioned popover
     nested inside was clipped away the moment the video folded (dock box shrinks to the bar) or the
     page hit ≤440px (bar clips + its horizontal scroll ate the panel's vertical scroll). Fixed to the
     viewport escapes both; JS sets top/right from the button's rect on open. */
  .dock-toc{position:fixed;z-index:60;
    background:var(--card);border:1px solid var(--line-strong);border-radius:.6rem;
    box-shadow:0 8px 28px rgba(0,0,0,.22);padding:.3rem;
    min-width:12rem;max-width:min(88vw,24rem);max-height:min(62vh,26rem);
    overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .dock-toc[hidden]{display:none;}
  .dock-toc-item{display:block;width:100%;text-align:left;font-family:var(--font-gothic);font-size:.82rem;
    color:var(--ink);background:transparent;border:0;border-radius:.4rem;padding:.5rem .6rem;cursor:pointer;line-height:1.35;}
  .dock-toc-item:hover{background:var(--card-2);color:var(--shu);}
  .dock-toc-item:focus-visible{outline:2px solid var(--shu);outline-offset:-2px;}
  .dock-toc-item.is-top{font-weight:600;border-bottom:1px solid var(--line);margin-bottom:.2rem;padding-bottom:.5rem;}
  /* 重点 (highlights) lens: hide non-key rows when active. body-scoped, container-agnostic. */
  body.highlights-only .u:not(.key){ display:none; }
  /* overlapped speech (#5): audio-derived, from diarize.py — NOT inferred from the text, which
     cannot carry simultaneity (two people at once produce one transcript line). A left rule rather
     than a badge: it marks a property of the AUDIO at that moment, not of the sentence's grammar,
     so it should read as a margin annotation and not compete with the grammar chips. */
  .u[data-overlap]{position:relative;}
  .u[data-overlap]::before{content:"";position:absolute;left:-.55rem;top:.35rem;bottom:.35rem;
    width:2px;border-radius:2px;background:repeating-linear-gradient(180deg,
      var(--ink-faint) 0 4px, transparent 4px 8px);}
  .u[data-overlap] .spk::after{content:"⇄";margin-left:.3rem;color:var(--ink-faint);
    font-size:.78em;} /* on the SPEAKER, since "who is audible here" is the thing in question */
  body.overlap-only .u:not([data-overlap]){ display:none; }
  /* 方言 → 标准语 (Bonus): the standard-Japanese form of a dialect point, for learners who only
     know textbook Japanese. Quiet, next to the chip; the arrow carries the meaning. */
  .dialect{font-family:var(--font-gothic);font-size:.74rem;color:var(--keigo);
    background:var(--keigo-t);border-radius:.9rem;padding:.05rem .45rem;margin-right:.35rem;white-space:nowrap;}
  body.dialect-only .u:not([data-dialect]){ display:none; }
  /* cross-page grammar badge (#4): "seen on N videos" — deliberately quiet. It sits beside a
     grammar chip and must never out-shout the chip itself or the note it precedes. */
  .xref{font-family:var(--font-mono);font-size:.62rem;line-height:1;white-space:nowrap;
    color:var(--ink-soft);background:var(--card-2);border:1px solid var(--line);border-radius:1rem;
    padding:.15rem .4rem;margin-left:.35rem;text-decoration:none;vertical-align:.06rem;}
  .xref:hover,.xref:focus-visible{color:var(--shu);border-color:var(--shu);}
  /* 存疑 (uncertain) marker: the pipeline's own (?) flag, made visible. Always dimmed + dotted so a
     learner can SEE which restorations are doubtful; the lens below hides those rows entirely. */
  .unsure{ opacity:.62; border-bottom:1px dotted currentColor; cursor:help; }
  body.hide-unsure .u[data-unsure]{ display:none; }
  /* 听写 (dictation) lens: mask the answer body; the active revealed row shows. visibility, not
     display, so the layout does not jump; the sibling .u-meta timestamp stays visible + tappable. */
  body.dictation .u .u-body{ visibility:hidden; }
  body.dictation .u.revealed .u-body{ visibility:visible; }
  /* dictation control bar — mirrors .dock-shadow; buttons share styling via the grouped selectors below */
  .dock-dict{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .6rem;
    padding:.5rem .85rem;background:var(--card-2);border-bottom:1px solid var(--line);}
  .dock-dict[hidden]{display:none;}
  .dict-grade{display:inline-flex;gap:.3rem;}
  .dict-grade[hidden]{display:none;}
  .dict-tally{margin-left:auto;font-size:.75rem;color:var(--ink-soft);white-space:nowrap;}
  .dock-dict .d-got.on,.dock-dict .d-got:hover{color:var(--paper);background:var(--joshi);border-color:var(--joshi);}
  .dock-dict .d-miss:hover{color:var(--paper);background:var(--shu);border-color:var(--shu);}
  /* control cluster, revealed under the dock bar when shadow is on */
  .dock-shadow{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .6rem;
    padding:.5rem .85rem;background:var(--card-2);border-bottom:1px solid var(--line);}
  .dock-shadow[hidden]{display:none;}
  .dock-shadow .sh-step,.dock-shadow .sh-mode button,.dock-shadow .sh-rate-cycle,.dock-dict .d-step{
    font-family:var(--font-gothic);font-size:.74rem;font-weight:600;cursor:pointer;color:var(--ink-soft);
    background:transparent;border:1px solid var(--line-strong);border-radius:2rem;padding:.22rem .6rem;
    white-space:nowrap;transition:color .12s,border-color .12s,background .12s;}
  .dock-shadow .sh-mode{display:inline-flex;gap:.3rem;}
  /* speed is ONE tap-to-cycle button (0.5→0.75→1→…): a segmented 0.5/0.75/1× control wrapped to a
     second row on a phone, stealing ~30px of transcript. .on = playing at a non-1× (drill) speed. */
  .dock-shadow .sh-rate-cycle{margin-left:auto;min-width:2.6rem;text-align:center;}
  .dock-shadow button:hover,.dock-dict button:hover{color:var(--keigo);border-color:var(--keigo);}
  .dock-shadow .sh-mode button.on,.dock-shadow .sh-rate-cycle.on{color:var(--paper);background:var(--keigo);border-color:var(--keigo);}
  .dock-shadow button:focus-visible,.dock-dict button:focus-visible{outline:2px solid var(--keigo);outline-offset:2px;}
  @media (hover:none) and (pointer:coarse){
    .dock-shadow-toggle,.dock-cn-toggle,.dock-layout-toggle{min-height:44px;padding:.5rem .9rem;}
    .dock-shadow .sh-step,.dock-shadow .sh-mode button,.dock-shadow .sh-rate-cycle,.dock-dict .d-step{min-height:44px;padding:.5rem .8rem;}
  }

  /* Four dock buttons + the injected play button no longer fit at the 320px reflow floor.
     Reclaim width by tightening gap + horizontal padding; the 44px min-HEIGHT tap target stays.
     Placed after the .dock-shadow-toggle touch-padding rule above (same specificity, later wins
     the cascade) so this narrow override is not itself overridden back to the wider padding. */
  @media (max-width:440px){
    /* Five dock buttons + play do not fit on a phone (even the 390px iPhone), so tighten padding AND
       make the bar SCROLL horizontally. overflow-x:auto is ADAPTIVE — it shows no scrollbar where the
       tightened buttons already fit and only scrolls where they don't; flex:0 0 auto keeps each button
       full-size and un-clipped either way. Covers 320/375/390/430 phones; tablets/desktop are untouched. */
    .dock-bar{ gap:.3rem; padding-left:.5rem; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .dock-bar::-webkit-scrollbar{ display:none; }
    .dock-follow,.dock-shadow-toggle,.dock-hl-toggle,.dock-dict-toggle,.dock-cn-toggle,.dock-layout-toggle,.dock-pin-toggle,.dock-toc-toggle,.dock-min{ padding-left:.5rem; padding-right:.5rem; flex:0 0 auto; }
    .dock-play{ padding-left:.4rem; padding-right:.4rem; flex:0 0 auto; }
    /* The 跟读 / 听写 control bars must stay ONE row on a phone — a wrapped 2nd row steals ~30px of
       transcript under a sticky dock. Same adaptive-scroll trick as .dock-bar: nowrap + overflow-x
       shows no scrollbar where the tightened controls already fit (the rate cycle button frees the
       width that the old 0.5/0.75/1× segment ate) and scrolls only where they don't. */
    .dock-shadow,.dock-dict{ flex-wrap:nowrap; gap:.3rem; padding-left:.55rem; padding-right:.55rem; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .dock-shadow::-webkit-scrollbar,.dock-dict::-webkit-scrollbar{ display:none; }
    .dock-shadow .sh-step,.dock-shadow .sh-mode button,.dock-shadow .sh-rate-cycle,.dock-dict .d-step{ flex:0 0 auto; }
  }

  /* filter / search bar (page_tools.js) */
  .filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem .6rem;margin:1.6rem 0 0;
    padding:.7rem .8rem;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--keigo);border-radius:.55rem;}
  #filterInput{font:inherit;font-size:.9rem;color:var(--ink);background:var(--paper);
    border:1px solid var(--line-strong);border-radius:2rem;padding:.4rem .9rem;flex:1 1 12rem;min-width:0;}
  .filter-cats{display:flex;flex-wrap:wrap;gap:.4rem;}
  .filter-cat{font-family:var(--font-gothic);font-size:.76rem;font-weight:600;cursor:pointer;
    background:transparent;border:1px solid currentColor;border-radius:2rem;padding:.24rem .7rem;white-space:nowrap;opacity:.75;transition:opacity .12s,background .12s;}
  /* `.on` flips the text to the page colour — which only reads when a background comes with it.
     The [data-cat] chips below supply their own accent; every OTHER filter-cat (存疑 / 被插话 /
     方言 / 遮中文) had no background rule, so its active state painted paper-on-paper and the
     label vanished. Give the generic case an ink fill; the accent rules out-specify it. */
  .filter-cat.on{opacity:1;background:var(--ink);border-color:var(--ink);color:var(--paper)!important;}
  .filter-cat[data-cat="katsu"]{color:var(--katsu);} .filter-cat[data-cat="katsu"].on{background:var(--katsu);border-color:var(--katsu);}
  .filter-cat[data-cat="keigo"]{color:var(--keigo);} .filter-cat[data-cat="keigo"].on{background:var(--keigo);border-color:var(--keigo);}
  .filter-cat[data-cat="joshi"]{color:var(--joshi);} .filter-cat[data-cat="joshi"].on{background:var(--joshi);border-color:var(--joshi);}
  .filter-cat[data-cat="goi"]{color:var(--goi);}     .filter-cat[data-cat="goi"].on{background:var(--goi);border-color:var(--goi);}
  .filter-reset{font-family:var(--font-gothic);font-size:.76rem;font-weight:600;cursor:pointer;color:var(--ink-soft);
    background:transparent;border:1px solid var(--line-strong);border-radius:2rem;padding:.24rem .7rem;}
  .filter-reset:hover{color:var(--shu);border-color:var(--shu);}
  .filter-cat:focus-visible,.filter-reset:focus-visible,#filterInput:focus-visible{outline:2px solid var(--keigo);outline-offset:2px;}
  /* 遮中文 state dots (page_tools.js): three positions inside the DOCK button — 关 · 遮中文 ·
     全遮. A click ON a dot jumps to that state; a click elsewhere on the button cycles. The
     control lives in the dock, not the filter bar: like 跟读/重点/听写 it acts on the PLAYER,
     and the filter bar scrolls out of view while studying. */
  .dock-cn-toggle .cn-dot{display:inline-block;width:.42rem;height:.42rem;border-radius:50%;
    border:1px solid currentColor;margin-left:.15rem;vertical-align:.02em;opacity:.45;}
  .dock-cn-toggle .cn-dot.on{background:currentColor;opacity:1;}
  .dock-layout-toggle .lay-dot{display:inline-block;width:.42rem;height:.42rem;border-radius:50%;
    border:1px solid currentColor;margin-left:.15rem;vertical-align:.02em;opacity:.45;}
  .dock-layout-toggle .lay-dot.on{background:currentColor;opacity:1;}
  .dock-layout-toggle .lay-dot.na{background:transparent;box-shadow:inset 0 0 0 1px currentColor;opacity:.7;}
  #filterEmpty{margin:1.2rem 0 0;padding:.9rem 1.15rem;font-size:.88rem;color:var(--ink-soft);
    background:var(--card);border:1px dashed var(--line-strong);border-radius:.5rem;}
  body.filtering .u.nomatch{display:none;}

  /* deep-link arrival flash (#s=<id>) — distinct from favorites' fav-jump */
  .u.s-jump{animation:s-jump 1.5s ease;}
  @keyframes s-jump{0%,28%{background:var(--keigo-t);box-shadow:inset 3px 0 0 var(--keigo);
    border-radius:0 .4rem .4rem 0;}100%{background:transparent;}}
  @media (prefers-reduced-motion:reduce){.u.s-jump{animation:none;}}

  /* per-row action cluster (share / copy-link) next to ★ / bookmark; hidden until hover/focus */
  .u-actions{display:inline-flex;gap:.25rem;margin-top:.1rem;opacity:0;transition:opacity .15s;}
  .u:hover .u-actions,.u:focus-within .u-actions{opacity:1;}
  .u-act{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--ink-faint);
    cursor:pointer;padding:.25rem;line-height:0;border-radius:.35rem;transition:color .15s,transform .1s;}
  .u-act:hover{color:var(--keigo);} .u-act:active{transform:scale(.9);}
  .u-act:focus-visible{outline:2px solid var(--keigo);outline-offset:2px;opacity:1;}
  .u-act svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;display:block;}
  #toast{position:fixed;left:50%;bottom:max(1.2rem,env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:50;font-family:var(--font-gothic);font-size:.82rem;color:var(--paper);background:var(--ink);
    border-radius:2rem;padding:.5rem 1rem;box-shadow:0 8px 22px -8px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;}
  #toast.show{opacity:.96;}
  @media (hover:none) and (pointer:coarse){
    .u-actions{opacity:1;}                 /* no hover on touch → always visible */
    .u-act{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:.4rem;}
    .filter-cat,.filter-reset{min-height:44px;}
  }

  /* ============================================================
     SYNCED STUDY-STATE — per-sentence notes (notes.js). plans/synced-study-state.md
     ============================================================ */
  .note-btn{font-size:.9rem;line-height:1;}
  .note-btn.has-note{color:var(--goi);}
  .u-note{margin:.5rem 0 0;}
  .u-note-ta{font:inherit;font-size:.9rem;width:100%;box-sizing:border-box;color:var(--ink);
    background:var(--paper);border:1px solid var(--line-strong);border-radius:.45rem;padding:.5rem .7rem;
    resize:vertical;line-height:1.6;}
  .u-note-ta:focus-visible{outline:2px solid var(--goi);outline-offset:1px;}

  /* resume banner (progress.js) — study pages */
  .resume-banner{display:flex;align-items:center;gap:.6rem;margin:1.2rem 0 0;padding:.6rem .9rem;
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--goi);border-radius:.5rem;}
  .resume-banner[hidden]{display:none;}
  .resume-go{font-family:var(--font-gothic);font-size:.85rem;font-weight:600;cursor:pointer;color:var(--goi);
    background:transparent;border:1px solid var(--goi);border-radius:2rem;padding:.32rem .9rem;white-space:nowrap;}
  .resume-go:hover{background:var(--goi);color:var(--paper);}
  .resume-x{margin-left:auto;font:inherit;font-size:.85rem;cursor:pointer;color:var(--ink-faint);
    background:transparent;border:0;padding:.2rem .4rem;}
  .resume-x:hover{color:var(--shu);}

  /* ? cheat sheet (keys.js) — study pages */
  .keys-overlay{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
    padding:1rem;background:rgba(0,0,0,.45);}
  .keys-overlay[hidden]{display:none;}
  .keys-card{position:relative;max-width:32rem;width:100%;max-height:88vh;overflow-y:auto;
    padding:1.4rem 1.6rem 1.6rem;background:var(--card);border:1px solid var(--line-strong);
    border-radius:.6rem;font-family:var(--font-cn);color:var(--ink);}
  .keys-card h2{margin:0 0 1rem;font-size:1.05rem;font-weight:600;}
  .keys-card h3{margin:1.1rem 0 .5rem;font-size:.8rem;font-weight:600;letter-spacing:.08em;
    color:var(--ink-faint);}
  .keys-row{display:flex;gap:.9rem;align-items:baseline;padding:.28rem 0;font-size:.88rem;
    color:var(--ink-soft);}
  .keys-k{flex:0 0 7.2rem;display:flex;gap:.3rem;flex-wrap:wrap;}
  .keys-card kbd{font-family:var(--font-mono);font-size:.78rem;line-height:1.5;color:var(--ink);
    background:var(--card-2);border:1px solid var(--line-strong);border-bottom-width:2px;
    border-radius:.3rem;padding:.05rem .4rem;white-space:nowrap;}
  .keys-note{margin:1.1rem 0 0;padding-top:.9rem;border-top:1px solid var(--line);
    font-size:.8rem;line-height:1.7;color:var(--ink-faint);}
  .keys-close{position:absolute;top:.7rem;right:.8rem;font:inherit;font-size:.95rem;cursor:pointer;
    color:var(--ink-faint);background:transparent;border:0;padding:.2rem .4rem;}
  .keys-close:hover{color:var(--shu);}
  @media (max-width:420px){ .keys-row{display:block;} .keys-k{margin-bottom:.15rem;} }

  /* ============================================================
     LAYOUTS — top / side / theater (layout.js; plans/page-layouts-design.md).
     html[data-layout] is the EFFECTIVE layout. Nothing here may move the dock in the DOM:
     a removed <video> pauses and a moved <iframe> reloads.
     ============================================================ */
  .lay-grip{display:none;font-family:var(--font-gothic);font-size:.8rem;line-height:1.2;
    cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink-soft);
    background:transparent;border:1px solid var(--line-strong);border-radius:2rem;
    padding:.24rem .55rem;flex:none;}
  .lay-grip:hover{color:var(--shu);border-color:var(--shu);}
  html[data-layout="top"] .lay-grip, html[data-layout="theater"] .lay-grip{display:inline-block;}
  .video-dock.min .lay-grip{display:none;}
  /* on a phone the tuned height budget decides the size (the UX suite's room checks) */
  @media (max-width:560px), (max-height:480px){ .lay-grip{display:none !important;} }
  @media (max-width:440px){ .dock-layout-toggle .lay-lbl{display:none;} }
  .lay-split{display:none;}
  html.lay-dragging, html.lay-dragging *{user-select:none;-webkit-user-select:none;}
  /* an embed would swallow the pointer mid-drag */
  html.lay-dragging iframe, html.lay-dragging video{pointer-events:none;}

  /* sized top / theater: the height budget is the viewer's and the width follows it (h·16/9),
     so it may outgrow the 46rem text column. The DOCK breaks out of .wrap (it is overflow:hidden,
     a wider child would be clipped) — with margins, never transform (a transformed ancestor
     becomes the containing block for fixed descendants). */
  html[data-dock-sized] .video-dock{
    --dock-w:max(100%, min(100vw - 2rem, calc(var(--dock-max) * 16 / 9)));
    width:var(--dock-w);margin-left:calc((100% - var(--dock-w)) / 2);}
  html[data-dock-sized] .dock-video{max-width:min(100%, calc(var(--dock-max) * 16 / 9));}

  /* side: the dock is a fixed left column (video first), the page scrolls beside it */
  html[data-layout="side"] body{padding-left:var(--side-w);}
  html[data-layout="side"] .video-dock{position:fixed;top:0;left:0;bottom:0;width:var(--side-w);
    margin:0;border-radius:0;border-width:0 1px 0 0;box-shadow:none;overflow-y:auto;
    display:flex;flex-direction:column;}
  html[data-layout="side"] .dock-video{order:-1;width:100%;max-width:none;margin:0;}
  html[data-layout="side"] .video-frame{max-height:calc(100vh - 3.5rem);}
  @supports (height:100dvh){ html[data-layout="side"] .video-frame{max-height:calc(100dvh - 3.5rem);} }
  html[data-layout="side"] .dock-bar{flex-wrap:wrap;}
  html[data-layout="side"] .lay-split{display:block;position:fixed;top:0;bottom:0;z-index:31;
    left:calc(var(--side-w) - 4px);width:8px;cursor:col-resize;touch-action:none;}
  html[data-layout="side"] .lay-split:hover, html.lay-dragging .lay-split{background:var(--line-strong);}

  /* theater: the big video, the dock bars under it, then previous · current · next only.
     (In a flex column an auto-margined box shrinks to its content, and an aspect-ratio frame
     has none — hence width:100% on .dock-video.)
     overflow-anchor:none — the rows change on EVERY line (previous hides, next appears, current
     grows), and the browser's scroll anchoring answered that with a scroll of its own, which
     follow read as the user's and switched itself off. Follow seats the rows instead. */
  html[data-layout="theater"]{overflow-anchor:none;}
  html[data-layout="theater"] .video-dock{display:flex;flex-direction:column;}
  html[data-layout="theater"] .dock-video{order:-1;width:100%;}
  /* :not(:focus-within) on the row hide and the neighbour trim — a row holding focus (an open
     笔记 editor) stays live whatever the window does: hiding it dropped focus to <body> and the
     next keystroke ran a page shortcut (a typed m folded the dock). */
  html[data-layout="theater"] .wrap > :not(.video-dock):not(.resume-banner):not(.chapter):not(.u),
  /* :not(.chapter) here too: a pre-fix page never closes a <section class="chapter"> but the
     last (build_page.py used to rely on the NEXT chapter's open to implicitly close it), so the
     browser nests chapter 2 inside chapter 1, chapter 3 inside chapter 2, and so on — this rule
     must still hide only each chapter's OWN non-.u children (its .chapter-h heading, and any
     reference/footer content an unclosed last chapter swallowed), never a NESTED <section
     class="chapter">, or the whole nested chapter (and whichever row is active inside it) goes
     dark. The :has() rule below is what keeps a nested chapter's ANCESTOR chapters visible. */
  html[data-layout="theater"] .chapter > :not(.u):not(.chapter),
  html[data-layout="theater"] .u:not(.lay-prev):not(.lay-cur):not(.lay-next):not(:focus-within){display:none !important;}
  /* the :has() trim sits in a rule OF ITS OWN: an engine without :has() drops the whole rule a
     :has() appears in, and inside the list above that took the row hide with it (theater showed
     every row). Alone, such an engine loses only this chapter trim. */
  html[data-layout="theater"] .chapter:not(:has(.lay-prev, .lay-cur, .lay-next, :focus-within)){display:none !important;}
  /* shown even if a filter (重点 …) had hidden them: theater follows the video's real order */
  html[data-layout="theater"] .u.lay-prev, html[data-layout="theater"] .u.lay-cur,
  html[data-layout="theater"] .u.lay-next{display:grid !important;}
  html[data-layout="theater"] .u.lay-prev:not(:focus-within) .u-body > :not(.u-jp),
  html[data-layout="theater"] .u.lay-next:not(:focus-within) .u-body > :not(.u-jp){display:none;}
  html[data-layout="theater"] .u.lay-prev, html[data-layout="theater"] .u.lay-next{opacity:.62;}
</style><style>button{font:inherit;min-height:44px;padding:10px 18px;color:var(--ink);background:var(--card);border:1px solid var(--line-strong);border-radius:8px;cursor:pointer}a{color:var(--shu)}</style></head><body><div class="wrap"><p class="eyebrow">学习记录迁移</p><h1>带上你的学习记录</h1>
<p class="sub">新版位于 <a href="https://lang.asher.place/">lang.asher.place</a>。在旧网址导出完整备份，再到新版账号中导入。所有记录仍保留在原处。</p>
<p id="migrationStatus" role="status" aria-live="polite"></p>
<div style="display:flex;gap:12px;flex-wrap:wrap;margin:24px 0">
<button id="migrationExport" type="button">导出本机完整备份</button><button id="migrationGist" type="button">读取旧 Gist 并导出</button>
</div><p>备份包括收藏、词汇、句子和词汇复习进度、笔记、播放进度、学习活动、学习设置、阅读位置和学完标记，不包含账号令牌。</p>
<p><a href="https://lang.asher.place/favorites.html">前往新版收藏与复习 →</a></p></div><script>
(function(){
  /*<<migration-pure>>*/
  function MIGRATION_PURE(){
    var pairs = {items:'langfav:v1',srs:'langfav:srs',notes:'langfav:notes',progress:'langfav:progress',vocab:'langfav:vocab',vsrs:'langfav:vsrs',activity:'langfav:activity',preferences:'langfav:preferences',reading:'langfav:reading',completed:'langfav:completed'};
    function safeMap(value){
      if (value == null) return {};
      if (typeof value !== 'object' || Array.isArray(value)) throw new Error('记录格式无效，请先保留旧数据。');
      var out = {};
      Object.keys(value).forEach(function(k){ if (k === '__proto__' || k === 'constructor' || k === 'prototype') throw new Error('记录格式无效。'); out[k] = value[k]; });
      return out;
    }
    function read(get){
      var out = {v:2}; Object.keys(pairs).forEach(function(ns){ out[ns] = safeMap(get(pairs[ns])); }); return out;
    }
    function merge(remote,local,ops){
      var out = {v:2}; remote = remote || {};
      Object.keys(pairs).forEach(function(ns){ out[ns] = Object.prototype.hasOwnProperty.call(remote,ns) ? safeMap(remote[ns]) : safeMap(local[ns]); });
      (ops || []).forEach(function(o){
        var ns = o.ns || 'items', key = o.key || o.id;
        if (!Object.prototype.hasOwnProperty.call(pairs,ns) || !key || /^(?:__proto__|constructor|prototype)$/.test(key)) return;
        if (o.op === 'del') delete out[ns][key];
        else if (o.op === 'set' || o.op === 'add') out[ns][key] = Object.prototype.hasOwnProperty.call(o,'value') ? o.value : o.record;
      });
      return out;
    }
    return {read:read,merge:merge};
  }
  /*<</migration-pure>>*/
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  var P = MIGRATION_PURE(), backup, status = document.getElementById('migrationStatus');
  function get(k){ var text = localStorage.getItem(k); return text ? JSON.parse(text) : null; }
  function summary(){
    backup = P.read(get);
    status.textContent = '本机记录：' + Object.keys(backup.items).length + ' 个收藏 · ' +
      Object.keys(backup.vocab).length + ' 个词汇 · ' + Object.keys(backup.notes).length + ' 条笔记。复习、播放进度、学习活动、学习设置、阅读位置和学完标记也会包含在备份中。';
  }
  function download(){
    var data = backup || P.read(get), url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    var a = document.createElement('a'); a.href = url; a.download = 'lang-study-backup.json'; a.click();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
  document.getElementById('migrationExport').addEventListener('click',function(){ try{download();}catch(e){status.textContent=e.message;} });
  document.getElementById('migrationGist').addEventListener('click',async function(){
    var button = this; button.disabled = true; status.textContent = '正在读取旧云端记录…';
    try{
      var token = localStorage.getItem('langfav:tok'), gid = localStorage.getItem('langfav:gid');
      if (!token) throw new Error('此浏览器没有旧 Gist 令牌。可先导出本机记录，或在新版账号中从 Gist 导入。');
      async function gh(path){ var r = await fetch('https://api.github.com'+path,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
        if (!r.ok) throw new Error('旧云端读取失败，请先导出本机记录。'); return r.json(); }
      if (!gid){
        var list = await gh('/gists?per_page=100'); var hit = list.find(function(g){return g.files&&g.files['lang-favorites.json'];});
        if (!hit) throw new Error('未找到旧 Gist。'); gid = hit.id;
      }
      var gist = await gh('/gists/'+encodeURIComponent(gid)), file = gist.files&&gist.files['lang-favorites.json'];
      if (!file || file.truncated || !file.content) throw new Error('旧 Gist 无法完整读取，请使用新版账号的导入功能。');
      backup = P.merge(JSON.parse(file.content),P.read(get),get('langfav:ops')||[]);
      download(); status.textContent = '完整备份已下载。请到新版登录，在账号的“备份与迁移”中导入。旧记录保持不变。';
    }catch(e){status.textContent=e.message;}finally{button.disabled=false;}
  });
  try{summary();}catch(e){status.textContent=e.message;}
})();
</script>
